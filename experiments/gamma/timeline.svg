<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 442"
     font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="442" fill="#ffffff"/>

  <text x="640" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Talos Cluster Deployment with Cilium</text>
  <text x="640" y="64" text-anchor="middle" font-size="14" fill="#475569">talosctl cluster create · then cilium install · steps not to scale</text>

  <!-- TIME AXIS (drawn with the arrows) -->
  <text x="40" y="88" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">TIME</text>

  <!-- PHASE 1 TIER (blue) -->
  <rect x="40" y="112" width="1200" height="106" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="60" y="132" font-size="12" font-weight="700" letter-spacing="2" fill="#0284c7">TALOSCTL CLUSTER CREATE · DOCKER</text>

  <rect x="60" y="138" width="176" height="64" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="80" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">containers</text>
  <text x="80" y="186" font-size="12.5" fill="#475569">1 CP + 2 workers</text>

  <rect x="256" y="138" width="176" height="64" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="276" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">configuration</text>
  <text x="276" y="186" font-size="12.5" fill="#475569">network patch applied</text>

  <rect x="452" y="138" width="176" height="64" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="472" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">bootstrap</text>
  <text x="472" y="186" font-size="12.5" fill="#475569">nodes boot · ignition</text>

  <rect x="648" y="138" width="176" height="64" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="668" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">etcd + API up</text>
  <text x="668" y="186" font-size="12.5" fill="#475569">control plane serving</text>

  <rect x="844" y="138" width="176" height="64" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="864" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">checks</text>
  <text x="864" y="186" font-size="12.5" fill="#475569">Ready: SKIP · no CNI</text>

  <rect x="1040" y="138" width="180" height="64" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1060" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">done</text>
  <text x="1060" y="186" font-size="12.5" fill="#475569">command returns</text>

  <!-- PHASE 2 TIER (green) -->
  <rect x="40" y="274" width="1200" height="106" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="60" y="294" font-size="12" font-weight="700" letter-spacing="2" fill="#10b981">CILIUM INSTALL · CILIUM.YAML</text>

  <rect x="60" y="300" width="373" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.55"/>
  <text x="80" y="326" font-size="14.5" font-weight="700" fill="#065f46">Cilium agent starts</text>
  <text x="80" y="348" font-size="12.5" fill="#475569">CNI plugin · replaces kube-proxy</text>

  <rect x="453" y="300" width="373" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.55"/>
  <text x="473" y="326" font-size="14.5" font-weight="700" fill="#065f46">CoreDNS starts</text>
  <text x="473" y="348" font-size="12.5" fill="#475569">cluster DNS resolves</text>

  <rect x="846" y="300" width="374" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="866" y="326" font-size="14.5" font-weight="700" fill="#065f46">node Ready</text>
  <text x="866" y="348" font-size="12.5" fill="#475569">all three nodes report Ready</text>

  <!-- ARROWS (drawn last) -->
  <line x1="40" y1="98" x2="1238" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="239" y1="170" x2="251" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="435" y1="170" x2="447" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="631" y1="170" x2="643" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="827" y1="170" x2="839" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1023" y1="170" x2="1035" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- handoff: done -> Cilium install (routing lane between the tiers) -->
  <path d="M 1130 221 L 1130 246 L 340 246 L 340 295" fill="none"
        stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="236" text-anchor="middle" font-size="11.5" fill="#475569">when done</text>

  <line x1="436" y1="332" x2="448" y2="332" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="829" y1="332" x2="841" y2="332" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LEGEND (badge bottom 422, 20 px above the canvas bottom) -->
  <g font-size="11.5" fill="#475569">
    <rect x="70" y="403" width="18" height="16" rx="4" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.5"/><text x="94" y="415">cluster create step</text>
    <rect x="250" y="403" width="18" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.5"/><text x="274" y="415">cilium install step</text>
    <rect x="440" y="403" width="18" height="16" rx="4" fill="#f8fafc" stroke="#475569" stroke-opacity="0.7" stroke-width="1.5"/><text x="464" y="415">phase end · thicker stroke</text>
    <line x1="660" y1="411" x2="698" y2="411" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="708" y="415">time</text>
    <text x="1240" y="415" fill="#64748b" text-anchor="end">docker · 1 CP + 2 workers · 10.5.1.0/24</text>
  </g>
</svg>
